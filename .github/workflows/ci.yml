# Buscador Documental CI. Everything runs in Docker (images pinned by digest in compose.yaml); nothing needs PHP,
# Tesseract or Postgres on the runner. Actions are pinned by major tag; pin to commit SHAs before the first release.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: php (unit, contract, db, search)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: make -C app test-unit
      - run: make -C app test-contract
      - run: make -C app test-db
      - run: make -C app test-search
      - run: make -C app clean
        if: always()

  worker:
    name: worker (python)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: make -C worker test
      - run: make -C worker test-glossary

  js:
    name: js (vitest + axe, committed bundle matches sources, size budget)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: make -C app test-js
      - run: make -C app check-js-drift

  smoke:
    name: smoke (permission canary)
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    needs: [php, worker, js]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: make -C app test-canary
      - run: make -C worker test-sandbox
      - run: make -C app test-e2e-formats
      - run: make -C app test-e2e-groupfolder
      - run: make -C app test-e2e-scope
      - run: make -C app test-e2e-events
      - run: make -C app test-e2e-erasure
      - run: make -C app test-e2e-reconcile
      - run: make -C app test-e2e-logs
      - run: make -C app test-e2e-rbac
      - run: make -C app test-e2e-vectors
      - run: make -C app test-e2e-egress
      - run: make -C app test-e2e-restore
      - run: make -C app test-e2e-ops
      - run: make -C app test-e2e-ui
      - name: Logs on failure
        if: failure()
        run: docker compose -f compose.yaml logs --no-color --tail=200
      - run: make -C app clean
        if: always()

  install:
    name: install (release tarball on a clean Nextcloud 34)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: [php, worker, js]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: make -C app test-e2e-install
      - run: docker compose -f compose.install.yaml --profile worker down -v --remove-orphans
        if: always()

  nc35:
    name: nc35 (same install on Nextcloud 35, not blocking)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    continue-on-error: true
    needs: [php, worker, js]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: NC_IMAGE=nextcloud:35-apache NC_FORCE=1 make -C app test-e2e-install
      - run: docker compose -f compose.install.yaml --profile worker down -v --remove-orphans
        if: always()
