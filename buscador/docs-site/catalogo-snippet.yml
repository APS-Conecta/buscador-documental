# Para catalogo.yml del repositorio documentation. NO se aplica todavía: gen-catalogo.py fija la nómina en 16 filas y exige paridad
# de las filas `nextcloud-app` con el registro OWN_APPS de gestion (provisioning/phases/12-apps.sh); añadir esta fila requiere
# ampliar la nómina y registrar la app allí (decisión de quien mantiene gestion y el catálogo).
  - repo: buscador-documental
    kind: nextcloud-app
    role: "Buscador Documental: busca por palabras o por significado, incluidos escaneos y fotografías, respetando los permisos de Nextcloud."
    manuals:
      - usuario/buscador-documental.md
      - administracion/ia/buscador-documental.md
      - desarrollo/buscador-documental.md
      - proyecto/novedades/buscador-documental.md
    depends_on: [gestion]
    status: "En diseño"
