# Throwaway measurement stack for Buscador S0. Project `bd-spike` (the `bd-` prefix is the Buscador workflow's rule for this
# shared VPS), loopback only; Nextcloud on 8190 is clear of the sibling dev stacks (8083, 8090, 8092, gestion 8180).
# Passwords are toys on purpose. Never shares data with gestion or any sibling stack; `make clean` removes only this project.
# No mem_limit/cpus on purpose: the measurements need the whole box, so run it when the host is quiet.
# PostgreSQL 17 (not the siblings' 18): the first pgvector image we verified was 0.8.7-pg17; a 0.8.7-pg18 tag also exists, so
# S1 can move to 18 (the data mount then changes to the parent /var/lib/postgresql, as in farmacia/compose.dev.yaml).
# nextcloud is pinned to 34.0.4 (as territorio does) so the recheck numbers are reproducible.
name: bd-spike

services:
  db:
    build: ./db
    image: bd-spike-db:pg17
    restart: "no"
    shm_size: 10g   # parallel HNSW build allocates maintenance_work_mem in /dev/shm
    volumes:
      - bd_pg:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: dev
    command: >
      postgres -c shared_buffers=4GB -c effective_cache_size=16GB
      -c maintenance_work_mem=2GB -c max_wal_size=8GB
      -c max_parallel_maintenance_workers=4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextcloud -d nextcloud"]
      interval: 5s
      timeout: 5s
      retries: 20

  nextcloud:
    image: nextcloud:34.0.4-apache
    restart: "no"
    ports:
      - "127.0.0.1:8190:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - bd_nc:/var/www/html
      - ./corpus/out:/corpus:ro
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: dev
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: admin
      NEXTCLOUD_TRUSTED_DOMAINS: localhost
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/status.php || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  worker:
    build: ./worker
    image: bd-spike-worker:1
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/work

volumes:
  bd_pg:
  bd_nc:
